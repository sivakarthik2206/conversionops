steps:
  - name: 'node:20-alpine'
    entrypoint: sh
    args: ['-c', 'npm install -g pnpm@9 && pnpm install --frozen-lockfile']
    id: install

  - name: 'node:20-alpine'
    entrypoint: sh
    args: ['-c', 'npm install -g pnpm@9 && pnpm run type-check']
    id: type-check
    waitFor: ['install']

  - name: 'node:20-alpine'
    entrypoint: sh
    args: ['-c', 'npm install -g pnpm@9 && pnpm run test']
    id: test
    waitFor: ['type-check']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', '$_AR_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/api:$COMMIT_SHA', '-f', 'apps/api/Dockerfile', '.']
    id: build-api
    waitFor: ['test']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', '$_AR_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/worker:$COMMIT_SHA', '-f', 'apps/worker/Dockerfile', '.']
    id: build-worker
    waitFor: ['test']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '$_AR_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/api:$COMMIT_SHA']
    id: push-api
    waitFor: ['build-api']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '$_AR_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/worker:$COMMIT_SHA']
    id: push-worker
    waitFor: ['build-worker']

  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: sh
    args:
      - '-c'
      - |
        wget -q https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.8.1/cloud-sql-proxy.linux.amd64 -O cloud-sql-proxy
        chmod +x cloud-sql-proxy
        ./cloud-sql-proxy $_DB_INSTANCE &
        sleep 5
        npm install -g pnpm@9
        DATABASE_URL="$$DATABASE_URL" pnpm --filter @conversionops/db exec prisma migrate deploy
    id: migrate
    waitFor: ['push-api']
    secretEnv: ['DATABASE_URL']

  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'conversionops-api'
      - '--image=$_AR_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/api:$COMMIT_SHA'
      - '--region=$_REGION'
      - '--platform=managed'
      - '--service-account=$_SA_EMAIL'
      - '--allow-unauthenticated'
    id: deploy-api
    waitFor: ['migrate']

  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'conversionops-worker'
      - '--image=$_AR_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/worker:$COMMIT_SHA'
      - '--region=$_REGION'
      - '--platform=managed'
      - '--service-account=$_SA_EMAIL'
      - '--no-allow-unauthenticated'
    id: deploy-worker
    waitFor: ['push-worker']

substitutions:
  _AR_REGION: us-central1
  _AR_REPO: conversionops
  _REGION: us-central1
  _SA_EMAIL: conversionops-runner@PROJECT_ID.iam.gserviceaccount.com
  _DB_INSTANCE: PROJECT_ID:us-central1:conversionops-db

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/DATABASE_URL/versions/latest
      env: DATABASE_URL

options:
  logging: CLOUD_LOGGING_ONLY
